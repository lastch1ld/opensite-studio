services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opensite
      POSTGRES_PASSWORD: opensite
      POSTGRES_DB: opensite
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://opensite:opensite@db:5432/opensite?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      APP_DOMAIN: ${APP_DOMAIN:-}
      MEDIA_STORAGE_PATH: /data/media
    volumes:
      - media-data:/data/media
      # Self-hosted plugin install model (docs/plugin-sdk.md): drop a
      # plugin directory in ./plugins on the host, then `docker compose
      # restart web` — bind-mounted so that doesn't require rebuilding
      # the image.
      - ./plugins:/app/plugins
    ports:
      - "3000:3000"

  # Reverse proxy for custom domains + TLS (docs/deployment.md). Optional in
  # local dev — only start it (`docker compose --profile proxy up`) once
  # APP_DOMAIN/custom domains are actually in play; plain `docker compose up`
  # still serves the app directly on :3000 without it.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["proxy"]
    depends_on:
      - web
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"

volumes:
  db-data:
  media-data:
  caddy-data:
  caddy-config:
